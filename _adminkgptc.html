
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - KGBTC Assignment Manager</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
              900: '#7c2d12',
            }
          },
          fontFamily: {
            heading: ['Space Grotesk', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0B0F17;
      color: #F3F4F6;
      font-family: 'Inter', sans-serif;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-brand-500 selection:text-white">

  <!-- TOP BAR -->
  <nav class="sticky top-0 z-40 glass-card border-b border-gray-800/80 px-4 lg:px-8 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-rose-500 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-brand-500/30">
        <i class="fa-solid fa-user-shield"></i>
      </div>
      <div>
        <span class="font-heading text-xl font-bold text-white tracking-wider block leading-tight">MECH<span class="text-brand-500">ADMIN</span></span>
        <span class="text-[10px] text-gray-400 font-mono tracking-widest block uppercase">KGBTC Kozhikode</span>
      </div>
    </div>

    <a href="index.html" class="px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all duration-200 bg-brand-500 text-white shadow-md shadow-brand-500/20">
      <i class="fa-solid fa-arrow-left mr-1.5"></i> Back to Portal
    </a>
  </nav>

  <!-- ADMIN DASHBOARD CONTAINER -->
  <div class="w-full max-w-7xl mx-auto px-4 py-8 space-y-6">
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 glass-card p-6 rounded-2xl border border-gray-800">
      <div>
        <h1 class="text-2xl font-heading font-bold text-white flex items-center">
          <i class="fa-solid fa-gauge-high text-brand-500 mr-3"></i> KGBTC Assignment Dashboard
        </h1>
        <p class="text-xs text-gray-400 mt-1">Real-time incoming student requests from Firebase Firestore</p>
      </div>

      <div class="flex items-center space-x-3">
        <button onclick="fetchAdminOrders()" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-xs font-medium text-gray-200 rounded-lg border border-gray-700 transition-all flex items-center">
          <i class="fa-solid fa-rotate mr-1.5"></i> Refresh List
        </button>
        <div class="text-xs text-gray-400 bg-gray-900 px-3 py-2 rounded-lg border border-gray-800 font-mono">
          Total Orders: <span id="totalOrderCount" class="text-brand-500 font-bold">0</span>
        </div>
      </div>
    </div>

    <!-- ORDERS DATA TABLE -->
    <div class="glass-card rounded-2xl border border-gray-800 overflow-hidden shadow-2xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-gray-300">
          <thead class="bg-gray-900/90 text-gray-400 font-semibold uppercase tracking-wider border-b border-gray-800">
            <tr>
              <th class="py-3.5 px-4">Student Selfie</th>
              <th class="py-3.5 px-4">Roll No</th>
              <th class="py-3.5 px-4">Name</th>
              <th class="py-3.5 px-4">Phone</th>
              <th class="py-3.5 px-4">Place</th>
              <th class="py-3.5 px-4">Requested Work</th>
              <th class="py-3.5 px-4">Timestamp</th>
              <th class="py-3.5 px-4">Status</th>
            </tr>
          </thead>
          <tbody id="ordersTableBody" class="divide-y divide-gray-800/60">
            <tr>
              <td colspan="8" class="text-center py-10 text-gray-500">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-brand-500 mb-2"></i>
                <p>Loading submission database...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="border-t border-gray-800/80 bg-gray-950 py-6 px-4 text-center text-xs text-gray-500">
    <p>© 2026 MechCraft KGBTC Kozhikode - Admin Portal</p>
  </footer>

  <!-- FIREBASE SDK INITALIZATION -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBhy9C1LoM-VBTcEGJVyZ5SGpbUg6fBdB8",
      authDomain: "meeting-49a0e.firebaseapp.com",
      projectId: "meeting-49a0e",
      storageBucket: "meeting-49a0e.firebasestorage.app",
      messagingSenderId: "716083133615",
      appId: "1:716083133615:web:86b1f9b28d31c81b25a85a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.collection = collection;
    window.getDocs = getDocs;

    // Trigger initial fetch when Firebase initializes
    fetchAdminOrders();
  </script>

  <script>
    async function fetchAdminOrders() {
      const tableBody = document.getElementById('ordersTableBody');
      const totalCount = document.getElementById('totalOrderCount');
      
      tableBody.innerHTML = `
        <tr>
          <td colspan="8" class="text-center py-10 text-gray-500">
            <i class="fa-solid fa-spinner fa-spin text-2xl text-brand-500 mb-2"></i>
            <p>Fetching records from Firebase...</p>
          </td>
        </tr>
      `;

      try {
        if (!window.db) {
          setTimeout(fetchAdminOrders, 1000);
          return;
        }

        const querySnapshot = await window.getDocs(window.collection(window.db, "assignments"));
        const orders = [];
        querySnapshot.forEach((doc) => {
          orders.push({ id: doc.id, ...doc.data() });
        });

        orders.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        totalCount.innerText = orders.length;

        if (orders.length === 0) {
          tableBody.innerHTML = `
            <tr>
              <td colspan="8" class="text-center py-10 text-gray-500">
                No assignment orders submitted yet.
              </td>
            </tr>
          `;
          return;
        }

        tableBody.innerHTML = orders.map(order => `
          <tr class="hover:bg-gray-800/40 transition-colors">
            <td class="py-3 px-4">
              <a href="${order.selfieUrl || '#'}" target="_blank" rel="noopener">
                <img src="${order.selfieUrl || 'https://placehold.co/50x50/111827/ffffff?text=User'}" alt="Selfie" class="w-10 h-10 rounded-full object-cover border border-brand-500/40 hover:scale-110 transition-transform">
              </a>
            </td>
            <td class="py-3 px-4 font-mono font-bold text-brand-500">#${order.rollNo || '-'}</td>
            <td class="py-3 px-4 font-medium text-white">${escapeHtml(order.name || '')}</td>
            <td class="py-3 px-4 font-mono">${escapeHtml(order.phone || '')}</td>
            <td class="py-3 px-4">${escapeHtml(order.place || '')}</td>
            <td class="py-3 px-4"><span class="px-2 py-1 bg-brand-500/10 text-brand-400 rounded text-[11px] font-medium border border-brand-500/20">${escapeHtml(order.workType || '')}</span></td>
            <td class="py-3 px-4 text-gray-500 text-[11px] font-mono">${new Date(order.timestamp).toLocaleString()}</td>
            <td class="py-3 px-4">
              <span class="px-2.5 py-1 bg-yellow-500/10 text-yellow-400 border border-yellow-500/30 rounded-full text-[10px] font-semibold">
                ${order.status || 'Pending'}
              </span>
            </td>
          </tr>
        `).join('');

      } catch (err) {
        console.error("Error fetching admin records:", err);
        tableBody.innerHTML = `<tr><td colspan="8" class="text-center py-6 text-red-400">Error loading orders: ${err.message}</td></tr>`;
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
